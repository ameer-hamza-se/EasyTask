name: easytask
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Adjusted minimum SDK to a widely compatible version.
  # If you have the Flutter SDK installed correctly, this should work.
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following packages were listed with correct versions from your code:
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  intl: ^0.18.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png  # optional, create assets/logo.png or remove this line

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 700